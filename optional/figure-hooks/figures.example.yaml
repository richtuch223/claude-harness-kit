  - strategy x
  - the thin-coin strategy
  value: gross ~$0.4k/yr median; <=~$1k/yr net at the deployed cap
  source_file: docs/DECISIONS.md
  source_quote: "~$0.4k/yr median"
  status: LIVE
  retracted_values:
  - $22k/yr
  retraction_note: that was annual notional THROUGHPUT, not earnings
